name: Contribution verdict

# The decision that counts. Runs after "Verify contribution" (which gives
# contributors quick feedback but runs with the pull request's own workflow
# files, so its result is never trusted). This workflow always uses the
# workflow and scripts of the default branch:
#
#   reverify (read-only token): takes only the patch files and ledger rows of
#     the pull request as data, refuses patches that could run code at compile
#     time (tools/site/scan_patch.py), then builds and measures with the
#     trusted checker and computes the points (tools/site/scoring.py).
#   act (write token, runs no pull request content): posts one comment with
#     the verdict, labels, and merges when the change is accepted with
#     positive points, the verdict is for the current head commit, and the
#     repository variable AUTO_MERGE_ENABLED is "true".

on:
  workflow_run:
    workflows: ["Verify contribution"]
    types: [completed]

permissions:
  contents: read

jobs:
  reverify:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the default branch (trusted scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find the pull request and copy its data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR" ]; then PR=$(gh pr list --repo "$REPO" --state open --search "$HEAD_SHA" --json number --jq '.[0].number'); fi
          LOGIN=$(gh pr view "$PR" --repo "$REPO" --json author --jq .author.login)
          git fetch --quiet origin "pull/$PR/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" || echo "note: the pull request moved on; checking $HEAD_SHA"
          BASE=$(git merge-base origin/${{ github.event.repository.default_branch }} "$HEAD_SHA")
          mkdir -p pr-data out
          git diff --name-only "$BASE" "$HEAD_SHA" > out/changed.txt
          # copy only data files; nothing from the pull request is executed
          while read -r f; do
            case "$f" in
              patches/*|data/ledger/*) mkdir -p "pr-data/$(dirname "$f")"; git show "$HEAD_SHA:$f" > "pr-data/$f" 2>/dev/null || true ;;
            esac
          done < out/changed.txt
          printf '{"pr": %s, "head_sha": "%s", "contributor": "%s"}\n' "$PR" "$HEAD_SHA" "$LOGIN" > out/pr.json
          cat out/pr.json
      - name: Refuse code that runs at compile time
        id: scan
        run: |
          find pr-data/patches -type f 2>/dev/null | sort > out/patches.txt || true
          if [ -s out/patches.txt ]; then
            python3 tools/site/scan_patch.py $(cat out/patches.txt) --json out/scan.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo '{"ok": false, "reasons": ["paths_allowed: the pull request adds no patch under patches/"]}' > out/scan.json
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Lean (elan)
        if: steps.scan.outputs.ok == 'true' && hashFiles('tools/verify_contribution.py') != ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and measure with the trusted checker
        if: steps.scan.outputs.ok == 'true'
        run: |
          if [ -f tools/verify_contribution.py ]; then
            python3 tools/verify_contribution.py --pr-dir pr-data --upstream "$RUNNER_TEMP/cfsg" \
              --pr-json out/pr.json --changed out/changed.txt --out out/verdict.json || true
          fi
      - name: Score
        run: |
          python3 - <<'PY'
          import json, os
          pr = json.load(open("out/pr.json"))
          scan = json.load(open("out/scan.json"))
          if os.path.exists("out/verdict.json"):
              v = json.load(open("out/verdict.json"))
          else:
              why = scan["reasons"] or ["verifier: tools/verify_contribution.py is not in this repository yet; nothing was checked"]
              v = {"schema": "concept-mining-verdict/v1", "checks": {}, "reasons": why}
          v.update(pr)  # the trusted values win over anything in the verdict
          v.setdefault("checks", {})["no_metaprogramming"] = bool(scan["ok"])
          v["reasons"] = list(dict.fromkeys(scan["reasons"] + v.get("reasons", [])))
          json.dump(v, open("out/verdict.json", "w"), indent=1)
          PY
          python3 tools/site/scoring.py verdict out/verdict.json > out/decision.json || true
          cat out/decision.json
      - uses: actions/upload-artifact@v4
        with:
          name: decision
          path: out/
          retention-days: 90

  act:
    needs: reverify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decision
          path: out
      - name: Comment, label, merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE_ENABLED }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          d = json.load(open("out/decision.json"))
          pr = int(d["pr"]); head = d["head_sha"]; repo = os.environ["REPO"]
          def gh(*a, check=True):
              return subprocess.run(["gh", *a], capture_output=True, text=True, check=check)
          cur = json.loads(gh("pr", "view", str(pr), "--repo", repo, "--json", "headRefOid,state").stdout)
          stale = cur["headRefOid"] != head
          meta = json.dumps({k: d[k] for k in ("accepted", "points", "shrink_points", "concept_points",
                                                 "tokens_saved", "cleanup_tokens", "head_sha", "scoring")})
          lines = ["<!--concept-mining-verdict-->", f"<!--concept-mining-meta:v1 {meta}-->",
                   f"### {'Accepted' if d['accepted'] else 'Not accepted'}: {d['points']} points", "",
                   f"Checked commit `{head[:7]}` with the default branch's checker. "
                   f"Rules: docs/scoring.md ({d['scoring']}).", ""]
          if d["reasons"]:
              lines += ["What to fix:", ""] + [f"- {r}" for r in d["reasons"]]
          if stale:
              lines += ["", "The pull request has new commits since this check; they will be checked again."]
          gh("pr", "comment", str(pr), "--repo", repo, "--body", "\n".join(lines))
          gh("pr", "edit", str(pr), "--repo", repo, "--add-label",
             "verified" if d["accepted"] else "not-accepted", check=False)
          if d["accepted"] and d["points"] > 0 and not stale and cur["state"] == "OPEN" \
                  and os.environ.get("AUTO_MERGE") == "true":
              r = gh("pr", "merge", str(pr), "--repo", repo, "--squash", "--match-head-commit", head, check=False)
              print(r.stdout, r.stderr)
          PY
