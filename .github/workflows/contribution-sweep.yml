name: Contribution sweep

# Housekeeping of contribution pull requests (tools/gate/sweep.py): check
# again what main's changes made stale, retry runs that did not finish, run
# reviews that waited for the daily budget, close what has stalled.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      requeue_target:
        description: check again every open contribution to this target (after a merge)
        required: false

permissions: {}

concurrency:
  group: contribution-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE_ENABLED }}
          TARGET: ${{ inputs.requeue_target }}
        run: |
          set -eu
          if [ -n "${TARGET:-}" ]; then
            case "$TARGET" in *[!A-Za-z0-9_/]*) echo "bad target"; exit 1 ;; esac
            python3 tools/gate/sweep.py --requeue-target "$TARGET"
          else
            python3 tools/gate/sweep.py
          fi
