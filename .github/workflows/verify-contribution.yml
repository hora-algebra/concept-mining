name: Verify contribution

# Quick feedback on every pull request that adds a refactoring (a patch under
# patches/). No secrets, no write access. Because a pull request can change
# this very file, its result is only a preview: the decision that counts is
# made by "Contribution verdict", which re-checks with the default branch's
# workflow and scripts.

on:
  pull_request:
    paths:
      - "patches/**"
      - "data/ledger/contributions.tsv"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record the pull request
        run: |
          mkdir -p out
          cat > out/pr.json <<JSON
          {"pr": ${{ github.event.pull_request.number }}, "head_sha": "${{ github.event.pull_request.head.sha }}",
           "contributor": "${{ github.event.pull_request.user.login }}"}
          JSON
      - name: Check that the verifier is installed
        id: have
        run: |
          if [ -f tools/verify_contribution.py ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import json
          pr = json.load(open("out/pr.json"))
          json.dump({**pr, "schema": "concept-mining-verdict/v1", "checks": {},
                     "reasons": ["verifier: tools/verify_contribution.py is not in this repository yet; nothing was checked"]},
                    open("out/verdict.json", "w"))
          PY
          fi
      - name: Refuse code that runs at compile time
        run: |
          P=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- patches | tr '\n' ' ')
          [ -z "$P" ] || python3 tools/site/scan_patch.py $P
      - name: Install Lean (elan)
        if: steps.have.outputs.ok == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify (apply patch, build, measure)
        if: steps.have.outputs.ok == 'true'
        run: |
          python3 tools/verify_contribution.py --pr-dir . --upstream "$RUNNER_TEMP/cfsg" \
            --pr-json out/pr.json --out out/verdict.json || true
          test -f out/verdict.json
      - name: Score
        run: |
          python3 tools/site/scoring.py verdict out/verdict.json > out/decision.json || true
          cat out/decision.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("out/decision.json"))
          print("## Contribution verdict\n")
          print(f"**{'Accepted' if d['accepted'] else 'Not accepted'}** — {d['points']} points "
                f"({d['tokens_saved']} tokens saved, {d['cleanup_tokens']} of them dead code)\n")
          for r in d["reasons"]:
              print(f"- {r}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: out/
          retention-days: 30
      - name: Fail when not accepted
        run: python3 -c "import json,sys; sys.exit(0 if json.load(open('out/decision.json'))['accepted'] else 1)"
